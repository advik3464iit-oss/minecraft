<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS 3D Minecraft Clone</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            user-select: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
    <!-- Include Three.js and PointerLockControls via CDN -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="crosshair">+</div>
    <div id="instructions">
        <strong>Click screen to lock mouse and play</strong><br>
        WASD = Move | Space = Jump<br>
        Left Click = Destroy Block<br>
        Right Click = Place Block (Dirt)
    </div>

    <script>
        // --- 1. Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7fc2ff); // Sky blue
        scene.fog = new THREE.FogExp2(0x7fc2ff, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- 2. Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.set(20, 40, 20);
        scene.add(directionalLight);

        // --- 3. Controls & Movement Variables ---
        const controls = new THREE.PointerLockControls(camera, document.body);
        
        document.body.addEventListener('click', () => {
            controls.lock();
        });

        controls.addEventListener('lock', () => {
            document.getElementById('instructions').style.display = 'none';
        });
        controls.addEventListener('unlock', () => {
            document.getElementById('instructions').style.display = 'block';
        });

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let canJump = false;
        const clock = new THREE.Clock();

        // --- 4. World Generation (Voxel Grid) ---
        const blockSize = 1;
        const worldSize = 32;
        const blocks = []; // Simple array storage for intersection check

        // Textures / Colors
        const materials = {
            grass: new THREE.MeshLambertMaterial({ color: 0x557a2b }),
            dirt: new THREE.MeshLambertMaterial({ color: 0x866043 })
        };
        const blockGeometry = new THREE.BoxGeometry(blockSize, blockSize, blockSize);

        // Generate terrain using a sine wave grid mimicking hills
        for (let x = -worldSize/2; x < worldSize/2; x++) {
            for (let z = -worldSize/2; z < worldSize/2; z++) {
                // Height formula
                let height = Math.floor(Math.sin(x * 0.1) * 3 + Math.cos(z * 0.1) * 3);
                
                // Fill columns up to height
                for (let y = -5; y <= height; y++) {
                    let material = materials.dirt;
                    if (y === height) material = materials.grass; // Top layer is grass

                    const block = new THREE.Mesh(blockGeometry, material);
                    block.position.set(x, y, z);
                    scene.add(block);
                    blocks.push(block);
                }
            }
        }

        // Spawn player above terrain
        camera.position.set(0, 10, 0);

        // --- 5. Input Listeners ---
        const onKeyDown = function (event) {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump === true) velocity.y += 12; canJump = false; break;
            }
        };

        const onKeyUp = function (event) {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyD': moveRight = false; break;
            }
        };

        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);

        // --- 6. Interactivity: Break & Place Blocks ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(0, 0); // Center of screen

        document.addEventListener('pointerdown', (event) => {
            if (!controls.isLocked) return;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0 && intersects[0].distance < 6) {
                const intersect = intersects[0];

                if (event.button === 0) { // Left Click: Break
                    scene.remove(intersect.object);
                    const index = blocks.indexOf(intersect.object);
                    if (index > -1) blocks.splice(index, 1);
                } 
                else if (event.button === 2) { // Right Click: Place
                    const block = new THREE.Mesh(blockGeometry, materials.dirt);
                    // Position block adjacent to the surface clicked
                    block.position.copy(intersect.object.position).add(intersect.face.normal);
                    scene.add(block);
                    blocks.push(block);
                }
            }
        });

        // Disable standard context menu for clean right-clicking
        document.addEventListener('contextmenu', event => event.preventDefault());

        // --- 7. Game Loop & Physics ---
        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked === true) {
                const delta = clock.getDelta();

                // Friction & deceleration
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 3.0 * delta; // Gravity

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                camera.position.y += (velocity.y * delta);

                // Simple Ground Collision (checks standard baseline layer)
                if (camera.position.y < 3.5) {
                    velocity.y = 0;
                    camera.position.y = 3.5;
                    canJump = true;
                }
            }

            renderer.render(scene, camera);
        }

        // --- 8. Window Resize Adjustment ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
